<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问题树 · 卡片分支图（原型）</title>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/markdown-it.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/katex/contrib/auto-render.min.js"></script>
<style>
  /* 原型：卡片分支图。颜色沿用 style.css 的变量，深浅色自动跟随。 */
  body { overflow-x: hidden; }
  .proto-head { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  .proto-head h1 { font-size: 17px; margin: 0 6px 0 0; }
  .proto-head .spacer { flex: 1; }
  .proto-head button, .proto-head .btn { font-size: 13px; padding: 4px 10px; }
  .proto-head button.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  .zoom { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .zoom button { border: 0; padding: 3px 8px; }
  .zoom .pct { font-size: 12px; color: var(--muted); min-width: 42px; text-align: center; }
  .legend { font-size: 12px; color: var(--muted); }
  .capture { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; padding: 12px 20px 0; }
  .capture textarea { min-height: 44px; }
  .inbox { padding: 6px 20px 0; font-size: 13px; }
  .inbox a { margin-right: 10px; }
  .wrap { display: grid; grid-template-columns: 1fr; position: relative; min-height: calc(100vh - 120px); }
  .wrap.wide { grid-template-columns: 1fr 440px; }
  .canvas-outer { overflow: auto; padding: 18px 20px 40px; }
  .fit-note { font-size: 12px; color: var(--muted); margin: 0 0 8px; min-height: 14px; }
  .canvas-scale { transform-origin: top left; }
  .canvas { position: relative; }
  .canvas svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .canvas svg path { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .canvas svg path.hot { stroke: var(--accent); stroke-width: 2; }
  .card { position: absolute; width: var(--card-w); height: var(--card-h); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px 8px; cursor: pointer; transition: box-shadow .15s, border-color .15s; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); border-color: var(--accent); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .card.dim { opacity: .5; }
  .card.root { border-width: 2px; }
  .card .top { display: flex; gap: 6px; align-items: center; min-height: 18px; }
  .card .q { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
  .card .chip { font-size: 11px; padding: 0 7px; }
  .card .title { font-size: 13.5px; font-weight: 600; line-height: 1.35; height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .verdict { font-size: 12.5px; color: var(--text); line-height: 1.4; height: 2.8em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .verdict::before { content: "→ "; color: var(--accent); }
  .card .verdict.fallback { color: var(--muted); }
  .card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); min-height: 18px; }
  .card .foot a { color: var(--accent); }
  .card .tog { border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; background: var(--bg); font-size: 11px; cursor: pointer; }
  .card .tog:hover { border-color: var(--accent); color: var(--accent); }
  /* 详情：宽屏是一列；窄屏是抽屉 */
  .detail { border-left: 1px solid var(--line); background: var(--panel); padding: 16px 18px 30px; overflow: auto; }
  .wrap.wide .detail { position: sticky; top: 56px; height: calc(100vh - 56px); }
  .wrap:not(.wide) .detail { position: fixed; top: 56px; right: 0; bottom: 0; width: 420px; max-width: 92vw; transform: translateX(105%); transition: transform .2s; box-shadow: -6px 0 24px rgba(0,0,0,.08); z-index: 6; }
  .wrap:not(.wide) .detail.open { transform: none; }
  .detail .close { float: right; font-size: 12px; }
  .wrap.wide .detail .close { display: none; }
  .detail h2 { font-size: 17px; margin: 0 0 8px; line-height: 1.35; }
  .detail h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 6px; letter-spacing: .3px; }
  .detail .meta { margin-bottom: 8px; }
  .detail .verdict-line { font-size: 14px; font-weight: 600; margin: 4px 0 10px; }
  .detail .verdict-line::before { content: "→ "; color: var(--accent); }
  .detail .answer-box { background: var(--accent-bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.65; }
  .detail .md { font-size: 13.5px; }
  .detail .md p { margin: 6px 0; }
  .detail .md ul { padding-left: 18px; margin: 4px 0; }
  .detail .kids a { display: block; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; margin: 4px 0; color: var(--text); font-size: 13px; }
  .detail .kids a:hover { border-color: var(--accent); text-decoration: none; }
  .detail .kids .v { color: var(--muted); font-size: 12px; }
  .detail details { margin: 6px 0; }
  .detail details summary { font-weight: 600; color: var(--text); font-size: 13px; }
  .detail .empty { color: var(--muted); font-size: 14px; margin-top: 30px; text-align: center; }
</style>
</head>
<body>
<div class="proto-head">
  <h1>问题树 · 卡片分支图</h1>
  <span class="legend" id="legend"></span>
  <span class="spacer"></span>
  <span class="zoom"><button id="z-out" title="缩小">−</button><span class="pct" id="z-pct">100%</span><button id="z-in" title="放大">＋</button><button id="z-fit" title="按宽度适应">适应</button><button id="z-100" title="实际大小">1:1</button></span>
  <button id="mode-all">全部展开</button>
  <button id="mode-focus">只看选中分支</button>
  <a class="btn" href="/#/ideas">正式页面</a>
</div>
<div class="capture">
  <textarea id="cap" placeholder="速记一个想法：模糊的也行，原话会被原样保存；agent 会整理挂到树上，不会改你的话。"></textarea>
  <div><button class="primary" id="save">记下</button></div>
</div>
<div class="inbox" id="inbox"></div>
<div class="wrap" id="wrap">
  <div class="canvas-outer" id="outer"><div class="fit-note" id="fit-note"></div><div class="canvas-scale" id="scale"><div class="canvas" id="canvas"><svg id="links"></svg></div></div></div>
  <aside class="detail" id="detail"><div class="empty">点一张卡片，这里显示完整的当前回答、证据、子问题，以及原话与历史。</div></aside>
</div>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const STATUS_ZH = { seed: "萌芽", exploring: "探索中", lab: "已立 lab", resolved: "已解决", parked: "搁置", dropped: "否决", inbox: "未整理" };
  const KIND_ZH = { route: "路线", method: "方法" };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const chip = (s) => s ? `<span class="chip ${esc(s)}">${esc(STATUS_ZH[s] || s)}</span>` : "";
  const kindChip = (k) => KIND_ZH[k] ? `<span class="chip kind">${KIND_ZH[k]}</span>` : "";
  const md = window.markdownit({ html: false, linkify: true });
  const CW = 232, CH = 150, GX = 18, GY = 56;
  document.documentElement.style.setProperty("--card-w", CW + "px"); document.documentElement.style.setProperty("--card-h", CH + "px");

  // ---------- markdown + 公式 ----------
  function protectMath(src) {
    const store = []; const keep = (m) => { store.push(m); return `MATHPH${store.length - 1}ENDPH`; };
    src = src.replace(/\$\$[\s\S]+?\$\$/g, keep).replace(/(^|[^\\$])\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g, (m, pre, body) => pre + keep("$" + body + "$"));
    return { src, store };
  }
  let LINKS = {};
  const routeFor = (kind, id) => ({ wiki: "/#/wiki/", card: "/#/refs/", lab: "/#/labs/", idea: "/#/ideas/", discussion: "/#/discussion/" }[kind] || "/#/wiki/") + id;
  function render(src) {
    const { src: s1, store } = protectMath(src || "");
    const s2 = s1.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (_, t, l) => { const r = LINKS[t.trim()]; return `[${(l || t).trim()}](${r ? routeFor(r.kind, r.id) : "/#/wiki/" + encodeURIComponent(t.trim())})`; });
    let html = md.render(s2).replace(/MATHPH(\d+)ENDPH/g, (_, i) => store[+i].replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])));
    const div = document.createElement("div"); div.className = "md"; div.innerHTML = html;
    div.querySelectorAll("img").forEach((im) => { const v = im.getAttribute("src") || ""; if (!/^(https?:|\/)/.test(v)) im.src = "/api/file?path=" + encodeURIComponent("ideas/" + v.replace(/^\.\//, "")); });
    div.querySelectorAll("a").forEach((a) => { const h = a.getAttribute("href") || ""; if (!/^(https?:|\/|#)/.test(h)) a.href = "/api/file?path=" + encodeURIComponent("ideas/" + h); });
    if (window.renderMathInElement) renderMathInElement(div, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false });
    return div;
  }
  const inline = (text) => { const d = render(text || ""); return d.innerHTML.replace(/^<p>|<\/p>\s*$/g, ""); };
  // 正文按 "## 标题" 切节（### 子标题留在节内）
  function sections(body) {
    const out = {}; let cur = null;
    for (const line of (body || "").split("\n")) {
      const m = line.match(/^##\s+(.+?)\s*$/);
      if (m) { cur = m[1]; out[cur] = []; continue; }
      if (cur) out[cur].push(line);
    }
    for (const k in out) out[k] = out[k].join("\n").trim();
    return out;
  }
  const firstSentence = (t) => (t || "").replace(/\*\*/g, "").split(/[。；！？\n]/)[0].slice(0, 40);

  // ---------- 数据与状态 ----------
  let ROOTS = [], INBOX = [], NODES = {}, SEL = null, MODE = "auto", ZOOM = null, USER_ZOOM = false;
  const count = (ns) => ns.reduce((n, x) => n + 1 + count(x.children), 0);
  function index(ns, parent = null, depth = 0) { for (const n of ns) { n.parent = parent; n.depth = depth; n.open = true; NODES[n.id] = n; index(n.children, n, depth + 1); } }
  const focusOn = () => MODE === "focus" || (MODE === "auto" && count(ROOTS) > 24);
  function applyFocus() {
    // 只展开根到选中节点的路径；只在"选中变化"时调用，手动收起/展开不会被覆盖
    const open = new Set(); for (let n = SEL; n; n = n.parent) open.add(n.id);
    (function walk(ns) { for (const n of ns) { n.open = open.has(n.id) || n.depth === 0; walk(n.children); } })(ROOTS);
  }
  function isDesc(n, anc) { for (let p = n.parent; p; p = p.parent) if (p.id === anc.id) return true; return false; }

  // ---------- 布局与绘制 ----------
  function measure(n) { n.w = (n.open && n.children.length) ? n.children.reduce((s, c) => s + measure(c), 0) : 1; return n.w; }
  function place(n, x0) { n.x = x0 + n.w / 2; let x = x0; if (n.open) for (const c of n.children) { place(c, x); x += c.w; } }
  function draw() {
    const canvas = $("#canvas"), svg = $("#links"), outer = $("#outer");
    $("#wrap").classList.toggle("wide", window.innerWidth >= 1100);
    canvas.querySelectorAll(".card").forEach((c) => c.remove()); svg.innerHTML = "";
    let x = 0; for (const r of ROOTS) { measure(r); place(r, x); x += r.w; }
    const colW = CW + GX, rowH = CH + GY; let maxDepth = 0;
    const visible = []; (function walk(ns) { for (const n of ns) { visible.push(n); maxDepth = Math.max(maxDepth, n.depth); if (n.open) walk(n.children); } })(ROOTS);
    const W = x * colW, H = (maxDepth + 1) * rowH - GY;
    canvas.style.width = W + "px"; canvas.style.height = H + "px"; svg.setAttribute("width", W); svg.setAttribute("height", H + GY);
    const avail = outer.clientWidth - 40; const fit = Math.max(0.75, Math.min(1, avail / W));  // 自动适应最小到 75%，再小就横向滚动，免得卡片字太小
    if (!USER_ZOOM) ZOOM = fit;
    const k = ZOOM; const sc = $("#scale");
    sc.style.transform = `scale(${k})`; sc.style.width = W + "px"; sc.style.height = (H * k) + "px"; sc.style.marginLeft = Math.max(0, (avail - W * k) / 2) + "px";
    $("#z-pct").textContent = Math.round(k * 100) + "%";
    $("#fit-note").textContent = (W * k > avail) ? "画布比窗口宽，可以横向滚动或缩小" : "";
    const px = (n) => n.x * colW - CW / 2, py = (n) => n.depth * rowH;
    const onPath = new Set(); for (let n = SEL; n; n = n.parent) onPath.add(n.id);
    for (const n of visible) {
      if (n.parent && n.parent.open) {
        const x1 = px(n.parent) + CW / 2, y1 = py(n.parent) + CH, x2 = px(n) + CW / 2, y2 = py(n), ym = y1 + GY / 2;
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", `M${x1},${y1} V${ym} H${x2} V${y2}`); if (onPath.has(n.id) && onPath.has(n.parent.id)) p.classList.add("hot"); svg.appendChild(p);
      }
      const card = document.createElement("div"); card.dataset.id = n.id;
      card.className = "card" + (n.depth === 0 ? " root" : "") + (SEL && SEL.id === n.id ? " sel" : "") + (SEL && !onPath.has(n.id) && !isDesc(n, SEL) ? " dim" : "");
      card.style.left = px(n) + "px"; card.style.top = py(n) + "px";
      const q = (n.title.match(/^(Q\d+[a-z]?)\s/) || [])[1] || "";
      const title = q ? n.title.slice(q.length + 1) : n.title;
      const verdict = n.meta.verdict; const fb = !verdict;
      card.innerHTML = `<div class="top">${q ? `<span class="q">${esc(q)}</span>` : ""}${kindChip(n.meta.kind)}${chip(n.meta.status)}</div>
        <div class="title" title="${esc(n.title)}">${esc(title)}</div>
        <div class="verdict${fb ? " fallback" : ""}">${verdict ? inline(verdict) : (n.answer ? inline(firstSentence(n.answer)) : "<i>还没有当前回答</i>")}</div>
        <div class="foot"><span>${(n.meta.labs || []).map((l) => `<a href="/#/labs/${esc(l)}" title="${esc(l)}">lab ${esc(l.slice(0, 2))}</a>`).join(" ")}</span>
          ${n.children.length ? `<span class="tog">${n.open ? "▾ 收起" : `▸ ${count(n.children)} 个子问题`}</span>` : ""}</div>`;
      card.onclick = (e) => { if (e.target.classList.contains("tog")) { n.open = !n.open; draw(); return; } if (e.target.tagName === "A") return; select(n); };
      canvas.appendChild(card);
    }
    $("#legend").textContent = `${count(ROOTS)} 个节点 · ${visible.length} 个显示中 · ${MODE === "auto" ? (focusOn() ? "自动：只展开选中分支" : "自动：全部展开") : MODE === "all" ? "全部展开" : "只看选中分支"}`;
    $("#mode-all").classList.toggle("on", MODE === "all"); $("#mode-focus").classList.toggle("on", MODE === "focus");
  }
  function revealCard(n) {
    // 让选中卡片可见：窄屏时抽屉盖住右边 420px，需要把画布往左滚
    const el = $(`.card[data-id="${CSS.escape(n.id)}"]`); if (!el) return;
    el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    if (!$("#wrap").classList.contains("wide")) {
      const r = el.getBoundingClientRect(); const limit = window.innerWidth - 420 - 16;
      if (r.right > limit) $("#outer").scrollBy({ left: r.right - limit, behavior: "smooth" });
    }
  }

  // ---------- 详情 ----------
  async function select(n) {
    SEL = n; if (focusOn()) { applyFocus(); n.open = true; } draw(); revealCard(n);
    const d = $("#detail"); d.classList.add("open");
    d.innerHTML = `<button class="close" id="close">关闭 ✕</button><h2>${esc(n.title)}</h2>
      <div class="meta">${kindChip(n.meta.kind)}${chip(n.meta.status)}${n.parent ? `<a href="#" data-sel="${esc(n.parent.id)}">上级：${esc(n.parent.title.replace(/^Q\d+[a-z]?\s/, "").slice(0, 16))}…</a>` : ""}${(n.meta.labs || []).map((l) => `<a href="/#/labs/${esc(l)}">lab ${esc(l)}</a>`).join("")}<a href="/#/ideas/${esc(n.id)}">完整页面 ↗</a></div>
      ${n.meta.verdict ? `<div class="verdict-line">${inline(n.meta.verdict)}</div>` : ""}
      <h3>当前回答</h3><div class="answer-box" id="ans"><span class="muted small">加载中…</span></div>
      <div id="rest"></div>`;
    const wire = () => { d.querySelectorAll("a[data-sel]").forEach((a) => a.onclick = (e) => { e.preventDefault(); select(NODES[a.dataset.sel]); }); $("#close").onclick = () => { d.classList.remove("open"); SEL = null; draw(); }; };
    wire();
    try {
      const full = await (await fetch(`/api/ideas/${encodeURIComponent(n.id)}`)).json();
      const S = sections(full.body); const ans = $("#ans"); ans.innerHTML = ""; ans.appendChild(render(S["当前回答"] || "_（还没有当前回答）_"));
      const rest = $("#rest"); let html = "";
      if (S["证据与链接"]) html += `<h3>关键证据与链接</h3><div id="ev"></div>`;
      if (n.children.length) html += `<h3>子问题</h3><div class="kids">${n.children.map((c) => `<a href="#" data-sel="${esc(c.id)}">${esc(c.title)}<br><span class="v">→ ${esc(c.meta.verdict || firstSentence(c.answer) || "未回答")}</span></a>`).join("")}</div>`;
      html += `<h3>原话与历史</h3>`;
      for (const h of ["原话", "agent 的理解", "历史", "派生", "agent 备注"]) if (S[h]) html += `<details ${h === "原话" ? "open" : ""}><summary>${esc(h)}</summary><div data-sec="${esc(h)}"></div></details>`;
      rest.innerHTML = html;
      if (S["证据与链接"]) $("#ev").appendChild(render(S["证据与链接"]));
      rest.querySelectorAll("[data-sec]").forEach((el) => el.appendChild(render(S[el.dataset.sec])));
      wire();
    } catch (e) { $("#ans").textContent = "加载失败：" + e.message; }
  }

  // ---------- 控件 ----------
  const setZoom = (z) => { USER_ZOOM = true; ZOOM = Math.min(2, Math.max(0.4, z)); draw(); };
  $("#z-in").onclick = () => setZoom(ZOOM * 1.15); $("#z-out").onclick = () => setZoom(ZOOM / 1.15);
  $("#z-100").onclick = () => setZoom(1); $("#z-fit").onclick = () => { USER_ZOOM = false; draw(); };
  $("#mode-all").onclick = () => { MODE = "all"; (function w(ns) { for (const n of ns) { n.open = true; w(n.children); } })(ROOTS); draw(); };
  $("#mode-focus").onclick = () => { MODE = "focus"; applyFocus(); if (SEL) SEL.open = true; draw(); };
  $("#outer").addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(ZOOM * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); } }, { passive: false });
  window.addEventListener("resize", draw);
  $("#save").onclick = async () => {
    const t = $("#cap").value.trim(); if (!t) return;
    await fetch("/api/ideas", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: t }) });
    $("#cap").value = ""; load();
  };

  async function load() {
    const [d, links] = await Promise.all([fetch("/api/ideas").then((r) => r.json()), fetch("/api/links").then((r) => r.json()).catch(() => ({}))]);
    LINKS = links; NODES = {};
    ROOTS = d.tree.filter((n) => !n.id.startsWith("inbox/")); INBOX = d.tree.filter((n) => n.id.startsWith("inbox/"));
    index(ROOTS);
    $("#inbox").innerHTML = INBOX.length ? `<b>未整理 (${INBOX.length})</b> ${INBOX.map((n) => `<a href="/#/ideas/${esc(n.id)}">${esc(n.title)}</a>`).join("")}` : "";
    if (SEL) SEL = NODES[SEL.id] || null;
    if (focusOn()) applyFocus();
    draw();
  }
  load();
})();
</script>
</body>
</html>
