# 课题配置（随 iCloud 同步，两台机器共用）。本机专属的东西在 .dashboard/machines/<host>.toml。

[project]
name = "{{PROJECT_NAME}}"
language = "zh"              # zh | en
data_root = "~/doc_unsyn/{name}"   # 大的中间数据放这里（studio），项目里只留 DATA.md

[models]
# 研究 agent：默认 Fable 5.1 + xhigh（extra high）。要单独指定：任务书 brief.md 的 frontmatter 写 model: / effort:，或任务页下拉选。
read = "claude-fable-5-1"    # 读文献、推导、跑数值、写 notes.md
effort = "xhigh"             # low / medium / high / xhigh / max；默认 extra high，特殊要求才 max

[writer]
# 薄层写作步（report.md、wiki 页、idea 当前回答、STATUS.md）交给 Codex（ChatGPT 账号登录，跑自动任务的机器上先 `codex login`）；见 rd-writer skill
backend = "codex"
model = "gpt-6-astra"
reasoning_effort = "xhigh"

[auditor]
# 审计步（推导审计每个 lab 收尾自动做；代码审计在 dashboard 点按钮）交给 Codex；见 rd-audit skill
backend = "codex"
model = "gpt-6-astra"
reasoning_effort = "xhigh"
auto_derivation = true      # lab 收尾时自动做推导审计

[agent]
backend = "claude"
max_turns = 0                # 0 = 不限
timeout_minutes = 240

[arxiv]
enabled = true
categories = ["cond-mat.str-el", "cond-mat.supr-con", "cond-mat.quant-gas"]
keywords = []                # 例如 ["flat band", "quantum geometry", "pair condensation"]
authors = []                 # 例如 ["Törmä", "Bernevig"]
max_per_day = 5
lookback_days = 3
hour = 9                     # 每天几点扫

[schedule]
watch_seconds = 15           # dashboard 开着时每 15 秒扫一次待办（网页上的动作本身是立刻触发）
tick_minutes = 60            # dashboard 没开时 launchd 的兜底间隔
retry_minutes = 30           # 某项失败后多久才重试
digest_minutes = 300          # 用户的回答每 5 小时统一消化一次（相关的裁决一起看）

[server]
host = "0.0.0.0"             # 0.0.0.0 才能从笔记本经 Tailscale 访问
port = 8010
write_from = ["127.0.0.1/32", "::1/128", "100.64.0.0/10"]   # 能写的来源：本机 + Tailscale；其他地址（校园网等）只读，可放心把网址给别人看
