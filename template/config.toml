# 课题配置（随 iCloud 同步，两台机器共用）。本机专属的东西在 .dashboard/machines/<host>.toml。

[project]
name = "{{PROJECT_NAME}}"
language = "zh"              # zh | en
data_root = "~/doc_unsyn/{name}"   # 大的中间数据放这里（studio），项目里只留 DATA.md

[models]
# 研究 agent：默认 Fable 5.1 + xhigh（extra high）。要单独指定：任务书 brief.md 的 frontmatter 写 model: / effort:，或任务页下拉选。
read = "claude-fable-5-1"    # 读文献、推导、跑数值、写 notes.md
effort = "xhigh"             # low / medium / high / xhigh / max；默认 extra high，特殊要求才 max

[models.kinds]
# 按工作项种类的默认模型。只凭摘要筛 arXiv、把原话挂进问题树这两类文书任务用 Opus（强度照样 xhigh）；
# 起草任务书、建卡、消化裁决、执行与续跑 lab 仍用上面 read 的模型。任务书 frontmatter 的 model/effort 优先。
arxiv_reason = { model = "claude-opus-5-5", effort = "xhigh" }
triage_idea = { model = "claude-opus-5-5", effort = "xhigh" }

[writer]
# 薄层写作步（report.md、wiki 页、idea 当前回答、STATUS.md）交给 Codex（ChatGPT 账号登录，跑自动任务的机器上先 `codex login`）；见 rd-writer skill
backend = "codex"
model = "gpt-6-astra"
reasoning_effort = "xhigh"

[auditor]
# 审计步交给 Codex；见 rd-audit skill。推导审计每个 lab 厚层齐后自动做，发现处理完要对当前版本复核到 pass；
# 薄层写完后自动做科学一致性检查；代码审计在 dashboard 点按钮。`rd finish` 只认覆盖当前文件版本的通过报告
backend = "codex"
model = "gpt-6-astra"
reasoning_effort = "xhigh"
auto_derivation = true      # 厚层齐后自动做推导审计（含修改后的复核）
auto_consistency = true     # 薄层写完后自动做科学一致性检查

[agent]
backend = "claude"
max_turns = 0                # 0 = 不限
timeout_minutes = 240

[arxiv]
enabled = true
categories = ["cond-mat.str-el", "cond-mat.supr-con", "cond-mat.quant-gas"]
keywords = []                # 例如 ["flat band", "quantum geometry", "pair condensation"]
authors = []                 # 例如 ["Törmä", "Bernevig"]
max_per_day = 5
lookback_days = 3
hour = 9                     # 每天几点扫

[schedule]
watch_seconds = 15           # dashboard 开着时每 15 秒扫一次待办（网页上的动作本身是立刻触发）
tick_minutes = 60            # dashboard 没开时 launchd 的兜底间隔
retry_minutes = 30           # 某项失败后多久才重试
resume_minutes = 60          # 等外部进程的 lab 没登记作业时，续跑最多每 60 分钟派一次；rd jobs claim 登记过的作业一结束就立刻派
digest_minutes = 300          # 用户的回答每 5 小时统一消化一次（相关的裁决一起看）

[cluster]
# 校园集群（UCSB CSC Pod，Slurm）：重的数值批量可以分摊到这里跑，studio 仍是默认。规则见 AGENTS.md §5，操作见 rd-lab skill 的 cluster.md，
# 命令 `rd cluster status|init|push|submit|jobs|pull|inventory`。两台机器的 ~/.ssh/config 都要有这个主机的免密配置。
enabled = true
name = "pod"
ssh = "pod-login1.cnsi.ucsb.edu"
dir = ""                       # 集群上的课题文件夹名；空 = 课题名、空白换下划线（例如 "Magic_in_heavy_fermion"）
scratch_root = "/bigscratch/jiaxin"   # 大的中间数据：<scratch_root>/<dir>/<lab id>/（70 TB NVMe，不备份）
home_root = "~"                       # 代码与最后画图用的汇总数据：<home_root>/<dir>/（结构同课题目录；/home 很满，别放大文件）
partition = "batch"            # 生产分区
test_partition = "short"       # 测试分区（2 小时上限）
default_time = "3-00:00:00"    # 生产作业默认时限（按实测 ×1.5 自己给 -t）
test_time = "01:30:00"
max_pending = 8                # 同时排队（PD）的作业不超过 8 个；在跑的不算。rd cluster submit 超了会拒绝
max_cpus_per_job = 20          # 单作业核数上限；一个作业里几条链用 -c N 并行，N 取 2–10 最容易排上

[server]
host = "0.0.0.0"             # 0.0.0.0 才能从笔记本经 Tailscale 访问
port = 8010
write_from = ["127.0.0.1/32", "::1/128", "100.64.0.0/10"]   # 能写的来源：本机 + Tailscale；其他地址（校园网等）只读，可放心把网址给别人看
readonly_show_controls = true   # 只读访客看得见按钮和输入框但点不动（置灰、提示"只读"）；false 则整块隐藏
guest_submissions = false       # true：任何人都能留名字投想法、向 agent 提问；你在网页上放行后 agent 才处理。给 AI 读的入口是 /llms.txt
